databases:
  - name: presently-db
    databaseName: presently
    user: presently_user
    plan: free

services:
  - type: web
    name: presently-attendance
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: presently-db
          property: connectionString
